<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal blob — prototype</title>
<style>
  :root{
    --bg:#0a0a0b; --surface:#141416; --ink:#f5f3f0; --muted:#9a968f;
    --accent:#ff5d22; --line:rgba(245,243,240,.09);
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .eyebrow{
    position:fixed;left:20px;top:18px;z-index:5;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    display:inline-flex;align-items:center;gap:.55rem;pointer-events:none;
  }
  .eyebrow::before{content:'';width:.45rem;height:.45rem;border-radius:999px;background:var(--accent)}
  .hint{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--muted);
    background:rgba(20,20,22,.6);border:1px solid var(--line);border-radius:999px;
    padding:.5rem .95rem;backdrop-filter:blur(6px);
  }
  .hint b{color:var(--ink);font-weight:500}
  .drop{position:fixed;inset:0;z-index:4;display:none;place-items:center;background:rgba(10,10,11,.7);
    font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-size:.9rem;
    border:2px dashed var(--accent);pointer-events:none}
  .drop.on{display:grid}
  #file{display:none}
  .lil-gui{--background-color:#141416;--widget-color:#20201f;--text-color:#f5f3f0;
    --title-background-color:#0f0f10;--font-family:var(--mono);--font-size:11px;
    --focus-color:#ff5d22;--number-color:#ff5d22;--string-color:#ff5d22;
    z-index:6;--width:230px}
</style>
</head>
<body>
<div id="app"></div>
<div class="eyebrow">Signal blob · prototype</div>
<div class="hint">Drag a photo in, or <b>click to upload</b> · drag the view to rotate</div>
<div class="drop" id="drop">Drop photo to mask</div>
<input type="file" id="file" accept="image/*" />
<div id="err" style="position:fixed;left:0;right:0;bottom:0;z-index:9;display:none;padding:12px 16px;background:#2a0f08;color:#ff9b73;font:12px/1.5 ui-monospace,monospace;border-top:1px solid #ff5d22;white-space:pre-wrap"></div>
<script>
(function(){var e=document.getElementById('err');function show(m){e.style.display='block';e.textContent='Prototype error: '+m;}
addEventListener('error',function(ev){show((ev.message||(ev.error&&ev.error.message)||'script failed to load')+(ev.filename?(' @ '+ev.filename):''));});
addEventListener('unhandledrejection',function(ev){show('promise: '+((ev.reason&&ev.reason.message)||ev.reason||''));});})();
</script>

    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x0a0a0b, 1);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0b);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.4);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(2, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xff5d22, 0.6);
rim.position.set(-3, -1, 2); scene.add(rim);

function placeholderTexture(){
  const c = document.createElement('canvas'); c.width=800; c.height=1000;
  const x = c.getContext('2d');
  x.fillStyle = '#141416'; x.fillRect(0,0,800,1000);
  const g = x.createRadialGradient(400,430,40,400,430,420);
  g.addColorStop(0,'#2a2a2e'); g.addColorStop(1,'#141416');
  x.fillStyle=g; x.fillRect(0,0,800,1000);
  x.fillStyle='#3a3a40';
  x.beginPath(); x.arc(400,420,150,0,Math.PI*2); x.fill();
  x.beginPath(); x.ellipse(400,760,230,180,0,Math.PI,0,true); x.fill();
  x.strokeStyle='rgba(255,93,34,.9)'; x.lineWidth=4;
  x.beginPath(); x.arc(400,420,200,0,Math.PI*2); x.stroke();
  x.fillStyle='#ff5d22'; x.font='28px monospace'; x.textAlign='center';
  x.fillText('DROP YOUR PHOTO', 400, 940);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const photoMat = new THREE.MeshBasicMaterial({ map: placeholderTexture(), toneMapped:false });
const photo = new THREE.Mesh(new THREE.PlaneGeometry(1,1), photoMat);
photo.position.z = -0.65; scene.add(photo);
let photoAspect = 1.0;
function layoutPhoto(){ const h = 3.25, w = h*photoAspect; photo.scale.set(w, h, 1); }
layoutPhoto();

function loadURL(url, revoke){
  new THREE.TextureLoader().load(url, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    if (photoMat.map) photoMat.map.dispose();
    photoMat.map = tex; photoMat.needsUpdate = true;
    photoAspect = tex.image.width / tex.image.height;
    layoutPhoto(); if (revoke) URL.revokeObjectURL(url);
  });
}
function loadPhoto(file){ loadURL(URL.createObjectURL(file), true); }
if (AVATAR) loadURL(AVATAR, false);

const snoise = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const params = {
  distortion: 0.03, scale: 0.55, speed: reduce ? 0 : 0.45,
  thickness: 1.4, roughness: 0.18, ior: 1.19, iridescence: 0.17, blobSize: 1.52,
  showPhoto: true, freeze: reduce
};

const mat = new THREE.MeshPhysicalMaterial({
  transmission: 1, metalness: 0, roughness: params.roughness, ior: params.ior,
  thickness: params.thickness, iridescence: params.iridescence, iridescenceIOR: 1.3,
  clearcoat: 0.4, clearcoatRoughness: 0.2, envMapIntensity: 1.1, color: 0xffffff,
  specularIntensity: 1, attenuationColor: new THREE.Color(0xffd9c4), attenuationDistance: 3
});

let blobShader = null;
mat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  shader.uniforms.uAmp  = { value: params.distortion };
  shader.uniforms.uFreq = { value: params.scale };
  shader.uniforms.uSpeed= { value: params.speed };
  blobShader = shader;
  shader.vertexShader = `uniform float uTime; uniform float uAmp; uniform float uFreq; uniform float uSpeed;
    ${snoise}
    float disp(vec3 p){ return snoise(p*uFreq + vec3(0.0,0.0,uTime*uSpeed)); }
  ` + shader.vertexShader;

  shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>', `
    float e = 0.0016;
    vec3 n0 = normalize(normal);
    vec3 t1 = normalize(cross(n0, abs(n0.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0)));
    vec3 t2 = normalize(cross(n0, t1));
    float d0 = disp(position)      * uAmp;
    float d1 = disp(position+t1*e) * uAmp;
    float d2 = disp(position+t2*e) * uAmp;
    vec3 pA = position + n0*d0;
    vec3 pB = (position + t1*e) + n0*d1;
    vec3 pC = (position + t2*e) + n0*d2;
    vec3 objectNormal = normalize(cross(pB-pA, pC-pA));
    if (dot(objectNormal, n0) < 0.0) objectNormal = -objectNormal;
    #ifdef USE_TANGENT
      vec3 objectTangent = vec3( tangent.xyz );
    #endif
  `);

  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
    vec3 transformed = position + normalize(normal) * (disp(position) * uAmp);
  `);
};

const blob = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 160), mat);
blob.scale.setScalar(params.blobSize); scene.add(blob);

const target = { x: 0, y: 0 };
let dragging = false, px = 0, py = 0, rotX = 0, rotY = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  target.x = (e.clientX / innerWidth) * 2 - 1;
  target.y = (e.clientY / innerHeight) * 2 - 1;
  if (dragging){ rotY += (e.clientX - px) * 0.006; rotX += (e.clientY - py) * 0.006; px = e.clientX; py = e.clientY; }
});

const fileInput = document.getElementById('file');
const dropEl = document.getElementById('drop');
document.querySelector('.hint').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadPhoto(e.target.files[0]); });
addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('on'); });
addEventListener('dragleave', e => { if (e.clientX===0&&e.clientY===0) dropEl.classList.remove('on'); });
addEventListener('drop', e => {
  e.preventDefault(); dropEl.classList.remove('on');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) loadPhoto(f);
});

const gui = new GUI({ title: 'Blob' });
gui.add(params, 'distortion', 0, 0.6, 0.01).name('distortion');
gui.add(params, 'scale', 0.4, 3, 0.01).name('noise scale');
gui.add(params, 'speed', 0, 1.5, 0.01).name('speed');
gui.add(params, 'blobSize', 0.8, 2, 0.01).name('blob size');
gui.add(params, 'thickness', 0, 4, 0.05).name('thickness');
gui.add(params, 'roughness', 0, 0.5, 0.01).name('frost');
gui.add(params, 'ior', 1, 2.0, 0.01).name('IOR');
gui.add(params, 'iridescence', 0, 1, 0.01).name('iridescence');
gui.add(params, 'showPhoto').name('show photo');
gui.add(params, 'freeze').name('freeze');

const clock = new THREE.Clock(); let t = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if (!params.freeze) t += dt;
  photo.visible = params.showPhoto;
  mat.thickness = params.thickness; mat.roughness = params.roughness;
  mat.ior = params.ior; mat.iridescence = params.iridescence;
  blob.scale.setScalar(params.blobSize);
  if (blobShader){
    blobShader.uniforms.uTime.value = t;
    blobShader.uniforms.uAmp.value = params.distortion;
    blobShader.uniforms.uFreq.value = params.scale;
    blobShader.uniforms.uSpeed.value = params.speed;
  }
  blob.rotation.y += (rotY - blob.rotation.y) * 0.08 + (params.freeze?0:0.0015);
  blob.rotation.x += (rotX - blob.rotation.x) * 0.08;
  blob.position.x += ((target.x * 0.25) - blob.position.x) * 0.05;
  blob.position.y += ((-target.y * 0.25) - blob.position.y) * 0.05;
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
